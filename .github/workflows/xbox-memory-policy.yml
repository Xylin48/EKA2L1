name: Xbox memory policy checks

on:
  push:
    branches:
      - 'dev/original-xbox-*'
  pull_request:
    paths:
      - 'src/xbox/memory_policy.h'
      - 'tests/xbox_memory_policy_test.cpp'
      - '.github/workflows/xbox-memory-policy.yml'
  workflow_dispatch:

jobs:
  memory-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile memory policy unit tests
        run: c++ -std=c++20 -Wall -Wextra -Werror -O2 tests/xbox_memory_policy_test.cpp -o /tmp/xbox-memory-policy-test
      - name: Run memory policy unit tests
        run: /tmp/xbox-memory-policy-test
